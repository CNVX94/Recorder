<!doctype html>
<meta charset="utf-8">
<title>Pantallas de terminal de Recorder (truecolor, tema oscuro)</title>
<style>
  body { background: #11111b; color: #cdd6f4; font: 14px "Segoe UI", sans-serif; margin: 16px; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  .rejilla { display: grid; grid-template-columns: repeat(2, 900px); gap: 16px; align-items: start; }
  figure { margin: 0; }
  figcaption { margin: 0 0 4px; color: #a6adc8; }
  img { width: 900px; display: block; }
</style>
<h1>Pantallas de terminal de Recorder · tema oscuro, truecolor, 100 columnas (calibrar-60: 60 columnas)</h1>
<div class="rejilla">
  <figure><figcaption>daily menu · Inicio (referencia del estilo nuevo)</figcaption><img src="menu-inicio.svg"></figure>
  <figure><figcaption>daily menu · Opciones</figcaption><img src="menu-opciones.svg"></figure>
  <figure><figcaption>daily calibrar</figcaption><img src="calibrar.svg"></figure>
  <figure><figcaption>daily sintesis (Reagrupar nota)</figcaption><img src="sintesis.svg"></figure>
  <figure><figcaption>daily config (asistente)</figcaption><img src="config.svg"></figure>
  <figure><figcaption>daily (grabación): líneas, pie y panel [o]</figcaption><img src="grabar.svg"></figure>
  <figure><figcaption>daily recomendar</figcaption><img src="recomendar.svg"></figure>
  <figure><figcaption>daily calibrar a 60 columnas</figcaption><img src="calibrar-60.svg"></figure>
</div>

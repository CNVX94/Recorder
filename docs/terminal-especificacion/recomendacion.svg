<text x="39.8" y="273" fill="#cdd6f4" font-weight="700" textLength="60.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Por qué</text>
<text x="57.0" y="292" fill="#cdd6f4" textLength="576.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">· Solo 2 de los 10 núcleos son rápidos: es un equipo de gama media.</text>
<text x="57.0" y="311" fill="#cdd6f4" textLength="748.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">· Media va unas 3 veces más rápido que el habla, con margen aunque la videollamada esté</text>
<text x="74.2" y="330" fill="#cdd6f4" textLength="249.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">abierta; Alta iría al límite.</text>
<text x="57.0" y="349" fill="#cdd6f4" textLength="756.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">· La tarjeta gráfica integrada comparte memoria y potencia con el procesador: no se usa.</text>
<text x="57.0" y="368" fill="#a6adc8" textLength="387.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Fiabilidad: medido en un equipo como el tuyo.</text>
